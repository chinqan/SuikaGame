<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Neon Shape Merge</title>
  <meta name="description" content="Neon Shape Merge – 霓虹幾何合成益智遊戲">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pixi.js@8.13.0/dist/pixi.min.js"></script>
</head>
<body>
  <div id="game-wrapper">
    <!-- Score -->
    <div id="hud">
      <div id="score-panel">
        <span class="label">SCORE</span>
        <span id="score-value">0</span>
      </div>
      <button id="leaderboard-btn" title="排行榜">🏆</button>
      <button id="settings-btn" title="設定">⚙️</button>
      <div id="next-panel">
        <span class="label">NEXT</span>
        <div id="next-container" style="width:80px;height:80px;"></div>
      </div>
    </div>

    <!-- Main canvas -->
    <div id="game-canvas-container"></div>

    <!-- Evolution bar -->
    <div id="evolution-bar">
      <div id="evo-container" style="height:80px;"></div>
    </div>

    <!-- Game Over overlay -->
    <div id="game-over" class="hidden">
      <div class="overlay-content">
        <h1>GAME OVER</h1>
        <p>最終分數：<span id="final-score">0</span></p>
        <p>最高紀錄：<span id="high-score">0</span></p>
        <button id="restart-btn">再來一局</button>
      </div>
    </div>

    <!-- Difficulty Select overlay -->
    <div id="difficulty-select">
      <div class="overlay-content">
        <h1>SELECT DIFFICULTY</h1>
        <div class="id-input-group">
          <label for="player-id-input">PLAYER ID</label>
          <input type="text" id="player-id-input" placeholder="輸入你的 ID" maxlength="16" value="">
        </div>
        <p class="diff-subtitle">選擇遊戲難度</p>
        <div class="diff-buttons">
          <button class="diff-btn easy" data-diff="easy">
            <span class="diff-label">EASY</span>
            <span class="diff-desc">7 種形狀</span>
          </button>
          <button class="diff-btn normal" data-diff="normal">
            <span class="diff-label">NORMAL</span>
            <span class="diff-desc">8 種形狀</span>
          </button>
          <button class="diff-btn hard" data-diff="hard">
            <span class="diff-label">HARD</span>
            <span class="diff-desc">9 種形狀</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Leaderboard overlay -->
    <div id="leaderboard" class="hidden">
      <div class="overlay-content leaderboard-content">
        <h1>🏆 LEADERBOARD</h1>
        <div id="leaderboard-table-wrap">
          <table id="leaderboard-table">
            <thead>
              <tr><th>#</th><th>ID</th><th>分數</th><th>難度</th><th>時間</th><th>日期</th></tr>
            </thead>
            <tbody id="leaderboard-body"></tbody>
          </table>
        </div>
        <button id="leaderboard-close-btn">關閉</button>
      </div>
    </div>

    <!-- Settings overlay -->
    <div id="settings" class="hidden">
      <div class="overlay-content settings-content">
        <h1>⚙️ SETTINGS</h1>

        <div class="settings-section">
          <h2 class="settings-section-title">🔊 合成音效</h2>
          <p class="settings-section-desc">選擇音效類型，並點擊下方形狀按鈕試聽</p>
          <div id="sound-type-selector">
            <select id="sound-type-select">
              <option value="standard">📦 標準音效</option>
              <option value="crystal">💎 水晶音效</option>
              <option value="waterdrop">💧 水滴聲</option>
              <option value="bomb">💥 炸彈聲</option>
              <option value="stone">🪨 堅硬石頭聲</option>
              <option value="cosmic">🌌 宇宙電波聲</option>
            </select>
          </div>
          <div id="sound-preview-grid"></div>
        </div>

        <button id="settings-close-btn">關閉</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
